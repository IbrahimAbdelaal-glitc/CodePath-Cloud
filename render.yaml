# Render Blueprint for the API
# The database is hosted elsewhere (Neon or Supabase), so enter its URLs in the Render dashboard.
services:
  - type: web
    name: codepath-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Public web app URL used in password reset links
      - key: APP_URL
        sync: false
      # Email: Render's free plan blocks SMTP ports, so use an HTTPS email API (Resend or Brevo)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Video uploads: S3-compatible storage (Neon Object Storage, Cloudflare R2, AWS S3)
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: us-east-2
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
